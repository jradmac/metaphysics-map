<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Survey Results · Private</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap">
<style>
:root{
 --paper:#e9eef1;--sheet:#f6f8f9;--ink:#16303f;--ink2:#4d6676;--line:#98adbb;--grid:#dce5eb;--grid2:#c9d6de;--hl:rgba(11,114,160,.08);--sel:#c0262d;
 --fA:#2a78d6;--fB:#eb6834;--fgray:#b9c6cf;
 --gG:#eda100;--gV:#2a78d6;--gL:#1baf7a;--gH:#eb6834;--gF:#e87ba4;--gJ:#e34948;--gW:#008300;--gK:#6250d6;--gN:#8a99a3;
 --f-ui:"B612",ui-sans-serif,system-ui,sans-serif;--f-mono:"B612 Mono",ui-monospace,Menlo,Consolas,monospace;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --paper:#090f14;--sheet:#0e171e;--ink:#cfe2ec;--ink2:#7f9aaa;--line:#355061;--grid:#13212b;--grid2:#1b2d3a;--hl:rgba(60,196,242,.09);--sel:#ff5d5d;
 --fA:#3987e5;--fB:#d95926;--fgray:#3e5463;
 --gG:#c98500;--gV:#3987e5;--gL:#199e70;--gH:#d95926;--gF:#d55181;--gJ:#e66767;--gW:#008300;--gK:#9085e9;--gN:#5f7280;color-scheme:dark}}
:root[data-theme="dark"]{
 --paper:#090f14;--sheet:#0e171e;--ink:#cfe2ec;--ink2:#7f9aaa;--line:#355061;--grid:#13212b;--grid2:#1b2d3a;--hl:rgba(60,196,242,.09);--sel:#ff5d5d;
 --fA:#3987e5;--fB:#d95926;--fgray:#3e5463;
 --gG:#c98500;--gV:#3987e5;--gL:#199e70;--gH:#d95926;--gF:#d55181;--gJ:#e66767;--gW:#008300;--gK:#9085e9;--gN:#5f7280;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--f-ui);padding:16px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1.5px solid var(--ink);padding-bottom:10px}
h1{margin:0;font-size:clamp(20px,3vw,28px);letter-spacing:.04em;text-transform:uppercase}
header p{margin:4px 0 0;color:var(--ink2);max-width:70ch;font-size:13px}
.tools{display:flex;border:1px solid var(--ink)}
.tools a,.tools button{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--ink);text-decoration:none;padding:8px 14px;background:transparent;border:0;cursor:pointer}
.tools a+a,.tools a+button,.tools button+a{border-left:1px solid var(--ink)}
.tools .solid{background:var(--ink);color:var(--sheet)}
.filters{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px}
.filters select{font:inherit;padding:6px 8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink)}
.filters label{display:inline-flex;align-items:center;gap:6px}
.card{border:1.5px solid var(--ink);background:var(--sheet);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:19px;line-height:1.25}
.card .lead{margin:0;font-size:14px;color:var(--ink);max-width:78ch}
.note{margin:0;font-size:12.5px;color:var(--ink2);max-width:90ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1.5px solid var(--ink);background:var(--sheet)}
.stat{padding:12px 14px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:40px;line-height:1.1;font-weight:700}
.stat span{font-size:12.5px;color:var(--ink2)}
.empty{border:1.5px dashed var(--line);padding:28px;text-align:center;color:var(--ink2);background:var(--sheet)}
svg.ch{width:100%;max-width:820px;height:auto;display:block}
.ftick{fill:var(--ink2);font-family:var(--f-mono);font-size:11px}
.flab{fill:var(--ink);font-size:13px;font-family:var(--f-ui)}
.fval{fill:var(--ink);font-family:var(--f-mono);font-size:11.5px}
.fgrid{stroke:var(--grid2);stroke-width:1}
.fzero{stroke:var(--line)}
.ftrack{stroke:var(--grid2);stroke-width:1}
.fring{stroke:var(--sheet);stroke-width:2}
.favg{stroke:var(--ink);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font-family:var(--f-mono);font-size:11.5px;padding:5px 10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--grid2);padding:5px 9px;text-align:left;white-space:nowrap}
th{font-weight:700}
details summary{cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--ink2);width:max-content}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--sheet);border:1px solid var(--ink);padding:6px 9px;font-size:12px;display:flex;flex-direction:column;gap:2px;max-width:280px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#tip b{font-family:var(--f-mono);font-size:13px}
#tip span{color:var(--ink2)}
[hidden]{display:none!important}
.err{color:var(--sel)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <div><div class="lbl">DWG MFS-001 · Sheet 3 · Private</div><h1>Survey Results</h1>
  <p>Anonymous responses from people who finished the test and chose to share. Only you can see this page.</p></div>
  <div class="tools"><a href="/">← THE MAP</a><button id="reload">REFRESH</button><a class="solid" href="/api/results.csv">DOWNLOAD CSV</a></div>
 </header>
 <div id="status" class="note">Loading…</div>
 <div id="app" hidden>
  <div class="filters card" style="padding:10px 14px;flex-direction:row">
   <label>Religious tradition <select id="fRel"></select></label>
   <label><input type="checkbox" id="fLatest" checked> Count each person once (their latest result)</label>
   <span class="note" id="fCount"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div id="sections" style="display:flex;flex-direction:column;gap:16px;margin-top:16px"></div>
 </div>
</div>
<div id="tip" hidden></div>
<script>
(function(){
const GN={G:"Union with the divine",V:"Character",L:"Liberation & peace",H:"Happiness",F:"Freedom",J:"Justice",W:"Harmony",K:"Understanding"};
const GORD=["V","H","L","G","F","W","K","J"];
const MODEL={x:.16,y:.65,z:.23};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sg=v=>{const r=Math.round(v);return r>0?"+"+r:r<0?"−"+Math.abs(r):"0";};
const mean=a=>a.reduce((s,v)=>s+v,0)/(a.length||1);
const sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/(a.length-1));};
const med=a=>{const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length?(b.length%2?b[m]:(b[m-1]+b[m])/2):0;};
const bar=(x,y,w,h)=>{const r=Math.min(4,w,h/2);return `M${x} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h-r}Q${x+w} ${y+h} ${x+w-r} ${y+h}H${x}Z`;};
const gc=k=>`var(--g${k||"N"})`;
let ALL=[],AX="z";
const $=id=>document.getElementById(id);

/* tooltips */
const tip=$("tip");
function showTip(t,x,y){const [v,l]=(t.dataset.tip||"").split("|");tip.textContent="";const b=document.createElement("b");b.textContent=v;tip.appendChild(b);if(l){const s=document.createElement("span");s.textContent=l;tip.appendChild(s);}tip.hidden=false;
 const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(8,Math.min(innerWidth-w-8,x+14))+"px";tip.style.top=(y-h-14<8?y+18:y-h-14)+"px";}
document.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t)showTip(t,e.clientX,e.clientY);else tip.hidden=true;});
document.addEventListener("focusin",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t){const r=t.getBoundingClientRect();showTip(t,r.left+r.width/2,r.top);}});
document.addEventListener("focusout",()=>{tip.hidden=true;});

function table(head,rows){return `<details><summary>Show the numbers as a table</summary><div class="tscroll"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;}
function card(title,lead,body,note){return `<section class="card"><h2>${title}</h2>${lead?`<p class="lead">${lead}</p>`:""}${body}${note?`<p class="note">${note}</p>`:""}</section>`;}

function current(){const rel=$("fRel").value,latest=$("fLatest").checked;let rows=ALL;
 if(latest){const seen=new Set();rows=rows.filter(r=>{if(seen.has(r.rid))return false;seen.add(r.rid);return true;});}   /* rows arrive newest first */
 if(rel==="__none")rows=rows.filter(r=>!r.religion);else if(rel)rows=rows.filter(r=>r.religion===rel);
 return rows;}

/* ω² of an axis by highest good */
function omega2(rows,key){const groups={};rows.forEach(r=>{if(r.good_top&&r[key]!=null)(groups[r.good_top]=groups[r.good_top]||[]).push(+r[key]);});
 const ks=Object.keys(groups);const all=ks.flatMap(k=>groups[k]);if(ks.length<2||all.length<ks.length+2)return null;
 const m=mean(all),sst=all.reduce((s,v)=>s+(v-m)**2,0),ssb=ks.reduce((s,k)=>s+groups[k].length*(mean(groups[k])-m)**2,0),msw=(sst-ssb)/(all.length-ks.length);
 return Math.max(0,(ssb-(ks.length-1)*msw)/(sst+msw));}

function render(){const rows=current(),peopleAll=new Set(ALL.map(r=>r.rid)),retook=[...peopleAll].filter(id=>ALL.filter(r=>r.rid===id).length>1).length;
 $("fCount").textContent=`${rows.length} result${rows.length===1?"":"s"} in view`;
 $("stats").innerHTML=[[ALL.length,"responses in total"],[peopleAll.size,"different people"],[retook,"people who retook the test"],[ALL.length?(med(ALL.filter(r=>r.duration_s).map(r=>r.duration_s))/60).toFixed(1):"—","median minutes to finish"]]
  .map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
 const S=[];
 if(!rows.length){$("sections").innerHTML=`<div class="empty">No responses match this filter yet.</div>`;return;}

 /* 1. highest goods */
 {const c={};rows.forEach(r=>{const k=r.good_top||"N";c[k]=(c[k]||0)+1;});const items=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  const W=720,L=200,R=70,rh=28,bh=16,max=Math.max(...items.map(i=>i[1])),sc=v=>L+(W-L-R)*v/max,H=items.length*rh+8;
  let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Highest goods">`;
  items.forEach(([k,v],i)=>{const y=4+i*rh,w=Math.max(2,sc(v)-L);s+=`<rect x="${L-150}" y="${y+3}" width="10" height="10" rx="2" fill="${gc(k==="N"?null:k)}"/><text x="${L-134}" y="${y+bh-3}" class="flab">${esc(k==="N"?"No clear good":GN[k])}</text><path d="${bar(L,y,w,bh)}" fill="var(--fA)" tabindex="0" data-tip="${v} (${Math.round(v/rows.length*100)}%)|${esc(k==="N"?"No clear good":GN[k])}"/><text x="${L+w+6}" y="${y+bh-3}" class="fval">${v} · ${Math.round(v/rows.length*100)}%</text>`;});
  S.push(card("What people aim at","Each person's strongest answer on the highest-good questions.",s+"</svg>"+table(["Highest good","People","Share"],items.map(([k,v])=>[k==="N"?"No clear good":GN[k],v,Math.round(v/rows.length*100)+"%"]))));}

 /* 2. does the model's main finding hold? */
 {const real={x:omega2(rows,"belief_x"),y:omega2(rows,"belief_y"),z:omega2(rows,"belief_z")};const ok=Object.values(real).some(v=>v!=null)&&rows.length>=30;
  const W=720,L=200,R=70,rh=56,bh=18,max=.8,sc=v=>L+(W-L-R)*v/max;let s=`<div class="legend"><span><i style="background:var(--fA)"></i>Real test-takers</span><span><i style="background:var(--fB)"></i>Famous thinkers (the model)</span></div><svg class="ch" viewBox="0 0 ${W} ${3*rh+24}" role="img" aria-label="Share of each axis explained by the highest good">`;
  [0,.2,.4,.6,.8].forEach(v=>{s+=`<line x1="${sc(v)}" x2="${sc(v)}" y1="0" y2="${3*rh-12}" class="fgrid"/><text x="${sc(v)}" y="${3*rh+16}" text-anchor="middle" class="ftick">${v*100}%</text>`;});
  [["x","X · mind ↔ matter"],["y","Y · where the ultimate is"],["z","Z · truth found or made"]].forEach(([k,n],i)=>{const y=i*rh;s+=`<text x="${L-12}" y="${y+bh+4}" text-anchor="end" class="flab">${n}</text>`;
   [[real[k],"--fA","Real test-takers"],[MODEL[k],"--fB","Famous thinkers"]].forEach(([v,c,l],j)=>{const yy=y+j*(bh+2);if(v==null){s+=`<text x="${L+4}" y="${yy+bh-4}" class="ftick">not enough data yet</text>`;return;}const w=Math.max(2,sc(v)-L);
    s+=`<path d="${bar(L,yy,w,bh)}" fill="var(${c})" tabindex="0" data-tip="${Math.round(v*100)}%|${n} · ${l}"/><text x="${L+w+6}" y="${yy+bh-4}" class="fval">${Math.round(v*100)}%</text>`;});});
  S.push(card("Does the map's main finding hold for real people?","For the famous thinkers, where the ultimate is (Y) was tied most strongly to the highest good. This compares the same measure for the people who took the test.",s+"</svg>",ok?"Share of each axis explained by the highest good (ω², corrected for chance). With fewer than about 100 people, treat differences as rough.":"Shown once at least 30 results are in view; until then the numbers swing too much to mean anything."));}

 /* 3. same faith, different metaphysics */
 {const by={};rows.forEach(r=>{const k=r.religion||"Prefer not to say";(by[k]=by[k]||[]).push(r);});const key={x:"belief_x",y:"belief_y",z:"belief_z"}[AX],axn={x:"X · mind ↔ matter",y:"Y · where the ultimate is",z:"Z · truth found or made"}[AX];
  const groups=Object.entries(by).filter(([,v])=>v.length>=3).sort((a,b)=>b[1].length-a[1].length);const allv=rows.map(r=>+r[key]);
  let body=`<div class="seg" role="group" aria-label="Axis">${["x","y","z"].map(a=>`<button data-ax="${a}" aria-pressed="${a===AX}">${a.toUpperCase()}</button>`).join("")}</div>`;
  if(!groups.length)body+=`<p class="note">Appears once a tradition has at least 3 results.</p>`;
  else{const W=720,L=210,R=110,rh=34,sc=v=>L+(v+100)/200*(W-L-R),H=groups.length*rh+30;let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spread within each tradition">`;
   [-100,-50,0,50,100].forEach(v=>{s+=`<line x1="${sc(v)}" x2="${sc(v)}" y1="0" y2="${groups.length*rh}" class="fgrid${v===0?" fzero":""}"/><text x="${sc(v)}" y="${H-6}" text-anchor="middle" class="ftick">${sg(v)}</text>`;});
   groups.forEach(([g,rs],i)=>{const y=i*rh+rh/2,vals=rs.map(r=>+r[key]);s+=`<text x="${L-12}" y="${y+4}" text-anchor="end" class="flab">${esc(g)} · ${rs.length}</text><line x1="${sc(-100)}" x2="${sc(100)}" y1="${y}" y2="${y}" class="ftrack"/>`;
    rs.forEach(r=>{const x=sc(+r[key]);s+=`<g tabindex="0" data-tip="${sg(+r[key])}|${esc(g)} · ${esc(r.good_top?GN[r.good_top]:"no clear good")}"><circle cx="${x}" cy="${y}" r="10" fill="transparent"/><circle cx="${x}" cy="${y}" r="4" fill="var(--fA)" class="fring" opacity=".85"/></g>`;});
    s+=`<line x1="${sc(med(vals))}" x2="${sc(med(vals))}" y1="${y-10}" y2="${y+10}" class="favg"/><text x="${W-R+10}" y="${y+4}" class="fval">spread ±${Math.round(sd(vals))}</text>`;});
   body+=s+"</svg>"+table(["Tradition","People","Median","Spread (SD)"],groups.map(([g,rs])=>{const v=rs.map(r=>+r[key]);return [g,rs.length,sg(med(v)),"±"+Math.round(sd(v))];}));}
  S.push(card("Same faith, different metaphysics",`Your thesis in one picture: if members of a tradition spread widely on an axis, their personal metaphysics goes beyond what the tradition fixes. Everyone in view spreads ±${Math.round(sd(allv))} on this axis; compare each tradition's spread to that.`,body,`Each dot is one person; the dark tick is the median. Showing ${axn}.`));}

 /* 4. beliefs vs decisions */
 {const g=rows.filter(r=>r.decide_y!=null).map(r=>Math.hypot(r.decide_y-r.belief_y,r.decide_z-r.belief_z));if(g.length){
  const bins=[0,10,20,30,40,55,70,90,1e9],lab=["0–10","10–20","20–30","30–40","40–55","55–70","70–90","90+"],cnt=lab.map((_,i)=>g.filter(v=>v>=bins[i]&&v<bins[i+1]).length),max=Math.max(...cnt,1);
  const W=720,L=40,B=40,H=200,bw=(W-L-20)/lab.length;let s=`<svg class="ch" viewBox="0 0 ${W} ${H+B}" role="img" aria-label="Gap between belief and decision pins">`;
  cnt.forEach((c,i)=>{const h=c/max*(H-20),x=L+i*bw+4,col=i<3?"var(--fA)":i<5?"var(--fgray)":"var(--fB)";s+=`<path d="M${x} ${H}V${H-h+Math.min(4,h)}Q${x} ${H-h} ${x+Math.min(4,h)} ${H-h}H${x+bw-8-Math.min(4,h)}Q${x+bw-8} ${H-h} ${x+bw-8} ${H-h+Math.min(4,h)}V${H}Z" fill="${col}" tabindex="0" data-tip="${c} people|gap of ${lab[i]} units"/><text x="${x+(bw-8)/2}" y="${H-h-5}" text-anchor="middle" class="fval">${c||""}</text><text x="${x+(bw-8)/2}" y="${H+16}" text-anchor="middle" class="ftick">${lab[i]}</text>`;});
  s+=`<line x1="${L}" x2="${W-16}" y1="${H}" y2="${H}" class="fzero" stroke="var(--line)"/></svg>`;
  const a=g.filter(v=>v<30).length,p=g.filter(v=>v>=30&&v<55).length,d=g.length-a-p;
  S.push(card("Do people's decisions follow their beliefs?",`${Math.round(a/g.length*100)}% aligned · ${Math.round(p/g.length*100)}% partly aligned · ${Math.round(d/g.length*100)}% diverging, using the same cut-offs the results card uses.`,`<div class="legend"><span><i style="background:var(--fA)"></i>Aligned (under 30)</span><span><i style="background:var(--fgray)"></i>Partly aligned (30–55)</span><span><i style="background:var(--fB)"></i>Diverging (55+)</span></div>`+s+table(["Gap (units)","People"],lab.map((l,i)=>[l,cnt[i]])),"The gap is the distance between someone's belief pin and decision pin on the up–down and front–back axes."));}}

 /* 5. where people land */
 {const W=420,P=34,sc=v=>P+(v+100)/200*(W-2*P),sy=v=>P+(100-v)/200*(W-2*P);let s=`<svg class="ch" style="max-width:460px" viewBox="0 0 ${W} ${W}" role="img" aria-label="Belief pins, Y against Z"><rect x="${P}" y="${P}" width="${W-2*P}" height="${W-2*P}" fill="none" stroke="var(--line)"/><line x1="${sc(0)}" x2="${sc(0)}" y1="${P}" y2="${W-P}" class="fgrid"/><line x1="${P}" x2="${W-P}" y1="${sy(0)}" y2="${sy(0)}" class="fgrid"/>
  <text x="${P}" y="${W-10}" class="ftick">← truth made</text><text x="${W-P}" y="${W-10}" text-anchor="end" class="ftick">truth found →</text><text x="${P}" y="${P-8}" class="ftick">↑ beyond</text><text x="${P}" y="${W-P-6}" class="ftick">↓ constructed</text>`;
  rows.forEach(r=>{s+=`<g tabindex="0" data-tip="Y ${sg(+r.belief_y)} · Z ${sg(+r.belief_z)}|${esc(r.religion||"Tradition not given")} · ${esc(r.good_top?GN[r.good_top]:"no clear good")}"><circle cx="${sc(+r.belief_z)}" cy="${sy(+r.belief_y)}" r="10" fill="transparent"/><circle cx="${sc(+r.belief_z)}" cy="${sy(+r.belief_y)}" r="4" fill="var(--fA)" class="fring" opacity=".8"/></g>`;});
  S.push(card("Where people land","Each person's belief pin, seen from the side: where the ultimate is (up–down) against whether truth is found or made (left–right).",s+"</svg>",""));}

 /* 6. retakes */
 {const by={};ALL.forEach(r=>{(by[r.rid]=by[r.rid]||[]).push(r);});const pairs=Object.values(by).filter(a=>a.length>1).map(a=>{const s=[...a].sort((x,y)=>new Date(x.created_at)-new Date(y.created_at)),f=s[0],l=s[s.length-1];
   return {n:s.length,days:Math.round((new Date(l.created_at)-new Date(f.created_at))/864e5),dx:l.belief_x-f.belief_x,dy:l.belief_y-f.belief_y,dz:l.belief_z-f.belief_z,g0:f.good_top,g1:l.good_top,rel:l.religion};});
  let body;if(!pairs.length)body=`<p class="note">No one has retaken the test yet. A retake on the same browser links to the earlier result automatically.</p>`;
  else{const m=k=>mean(pairs.map(p=>Math.abs(p[k]))).toFixed(1),gch=pairs.filter(p=>p.g0!==p.g1).length;
   body=`<p class="lead">Average movement between first and latest result: X ${m("dx")} · Y ${m("dy")} · Z ${m("dz")} units. ${gch} of ${pairs.length} changed their highest good.</p>`+
    `<div class="tscroll"><table><thead><tr><th>Results</th><th>Days apart</th><th>ΔX</th><th>ΔY</th><th>ΔZ</th><th>Highest good: first → latest</th><th>Tradition</th></tr></thead><tbody>${pairs.slice(0,200).map(p=>`<tr><td>${p.n}</td><td>${p.days}</td><td>${sg(p.dx)}</td><td>${sg(p.dy)}</td><td>${sg(p.dz)}</td><td>${esc(p.g0?GN[p.g0]:"—")} → ${esc(p.g1?GN[p.g1]:"—")}</td><td>${esc(p.rel||"—")}</td></tr>`).join("")}</tbody></table></div>`;}
  S.push(card("Retakes: what moves first?",`With three or more results from the same people, you can start to see whether beliefs about reality or the highest good tends to change first.`,body,"Uses every result, regardless of the filters above."));}

 /* 7. recent */
 {const rec=ALL.slice(0,25);S.push(card("Most recent results","",`<div class="tscroll"><table><thead><tr><th>When</th><th>Tradition</th><th>Belief pin (X, Y, Z)</th><th>Highest good</th><th>Region</th><th>Minutes</th></tr></thead><tbody>${rec.map(r=>`<tr><td>${esc(new Date(r.created_at).toLocaleString())}</td><td>${esc(r.religion||"—")}</td><td>${sg(+r.belief_x)}, ${sg(+r.belief_y)}, ${sg(+r.belief_z)}</td><td>${r.good_top?`<i class="sw" style="background:${gc(r.good_top)}"></i>`+esc(GN[r.good_top]):"—"}</td><td>${esc(r.region||"—")}</td><td>${r.duration_s?(r.duration_s/60).toFixed(1):"—"}</td></tr>`).join("")}</tbody></table></div>`,""));}

 $("sections").innerHTML=S.join("");
 document.querySelectorAll("[data-ax]").forEach(b=>b.onclick=()=>{AX=b.dataset.ax;render();});}

async function load(){$("status").textContent="Loading…";$("status").classList.remove("err");
 try{const r=await fetch("/api/results",{cache:"no-store"});const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok){$("status").textContent=j.error?"The database isn't connected yet ("+j.error+"). Check the DATABASE_URL variable in Railway.":"Couldn't load results.";$("status").classList.add("err");$("app").hidden=true;return;}
  ALL=j.rows;$("status").textContent=ALL.length?`Updated ${new Date().toLocaleTimeString()}.`:"No responses yet. Results appear here as soon as people finish the test and choose to share.";
  const rels={};ALL.forEach(r=>{const k=r.religion||"";rels[k]=(rels[k]||0)+1;});const sel=$("fRel"),cur=sel.value;
  sel.innerHTML=`<option value="">All traditions</option>`+Object.entries(rels).filter(([k])=>k).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<option value="${esc(k)}">${esc(k)} (${v})</option>`).join("")+(rels[""]?`<option value="__none">Not given (${rels[""]})</option>`:"");
  sel.value=cur;$("app").hidden=!ALL.length;if(ALL.length)render();}
 catch(e){$("status").textContent="Couldn't reach the server.";$("status").classList.add("err");}}
$("fRel").onchange=render;$("fLatest").onchange=render;$("reload").onclick=load;
load();
})();
</script>
